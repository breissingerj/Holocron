version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /pi/extensions/google-drive
      - /pi/extensions/graphiti-memory
      - /pi/extensions/pi-devin-auth
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /mcp/graphiti-mcp
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /mcp/graphiti-mcp
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
